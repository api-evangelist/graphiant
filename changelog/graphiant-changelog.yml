cadence: monthly, tracking the Latest release train (see lifecycle/graphiant-lifecycle.yml)
history_span: 25.6.1 (2025-06-02) through 26.7.0 (2026-07-27) — 20 published releases
breaking_change_policy: >-
  No release in the captured window declares a breaking change. Superseded OpenAPI
  bundles are deleted from the repository rather than archived (each release "Removed"
  section drops the previous graphiant_api_docs_vNN.json), so historical contract diffs
  are only recoverable from git history. New capability is added as parallel path
  families rather than versioned in place — 26.7.0 introduced /v1/extranet/b2b/... next
  to the existing /v1/extranets/b2b/... without deprecating either.
entries:
- version: 26.7.0
  date: '2026-07-27'
  spec_bundle: graphiant_api_docs_v26.7.0.json
  breaking: false
  additions:
  - B2B extranet — a new /v1/extranet/b2b/... path family covering consumers, customers,
    matches, producer and services, alongside the pre-existing /v1/extranets/b2b/... paths
  - OSPF interface authentication (ManaV2OspfAuthentication, ManaV2NullableOspfAuthenticationConfig)
  - Auth error response models for login callback, SAML login, refresh and session
  changes:
  - AssuranceKpiMetric gained token_usage; AssuranceUserDefinition gained tokens_usage
    and tokens_usage_days (AI adoption token accounting)
  - ManaV2GatewayDetails gained ipsec_gateway_peers
  - V1InvitationEmailPostRequest gained service_type
- version: 26.6.0
  date: '2026-07-08'
  spec_bundle: graphiant_api_docs_v26.6.0.json
  breaking: false
  additions:
  - Public VIF (PVIF) gateway CRUD under /v1/pvif with centralized/decentralized NAT
    and consumer LAN device models
  - Assurance AI adoption — /v2/assurance/ai-adoption-summary plus approve-entry
    create/read/update/delete and /v2/assurance/get-app-names
  - GET /v1/lan-segments/interfaces/public
  - GET /v1/regions/{regionId}/gateways
  - GET /v1/ztagent/agents
- version: 26.5.0
  date: '2026-06-10'
  spec_bundle: graphiant_api_docs_v26.5.0.json
  breaking: false
  additions:
  - Extranet public VIF CRUD under /v1/extranet-public-vif plus a /check operation
  - GET /v1/msp/managed-enterprise-contract-info (MSP billing)
  - GET /v1/sites/map/details
  - CommonBillingContract and CommonBillingTimePeriod models
  changes:
  - generated Pydantic fields now carry OpenAPI example metadata
  security:
  - urllib3 pinned to 2.7.0 for decompression-bomb and cross-origin header-forwarding fixes
- version: 26.4.0
  date: '2026-04-30'
  spec_bundle: graphiant_api_docs_v26.4.0.json
  breaking: false
  additions:
  - Global content filters CRUD under /v1/global/content-filters and domain categories
    at /v1/global/domain-categories
  - Software upgrade rollouts — /v1/software/rollouts CRUD plus /schedule, with
    weekly/monthly/yearly recurrence models
  - ZTAgent bindings at /v1/ztagent/bindings
  - MACsec status at /v2/monitoring/macsec/{deviceId}/status
  security:
  - pytest raised to >= 9.0.3 for CVE-2025-71176
