notes: >-
  Graphiant publishes no dated API changelog on docs.graphiant.com — product release
  notes are surfaced inside the authenticated Graphiant Portal. The only public dated,
  per-endpoint record of API change is the Python SDK changelog, which is written in
  Keep a Changelog format and enumerates every added path, model and schema per release
  because the SDK is regenerated from the OpenAPI bundle. It is therefore the de-facto
  API changelog and is treated as such here. The Go SDK repository carries an equivalent
  changelog for the same release train.
scheme: keep-a-changelog
versioning: CalVer YY.M.patch, matched to the platform release train
current_version: 26.7.0
current_version_date: '2026-07-27'
