async_job_errors:
  note: >-
    Device configuration is asynchronous. PUT /v1/devices/{deviceId}/config returns
    HTTP 200 with a {"jobId": <int>} body even when the configuration is later rejected
    on the device. A 2xx from the config endpoints means "accepted", not "applied" —
    poll the jobs API for the real outcome.
  submit_operation: PUT /v1/devices/{deviceId}/config
  response: {jobId: integer}
