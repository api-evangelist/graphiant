notes: >-
  Graphiant does not use RFC 9457 problem+json. Errors come back as a flat JSON object
  on the ordinary application/json content type. Two envelopes are in use: the general
  portal envelope {errorCode, displayError, detailedError} documented in the REST API
  guide, and an auth-specific envelope {auth, token, error} declared in the OpenAPI as
  v1AuthErrorPostResponse. Error coverage in the spec is thin — 37 declared 4xx/5xx
  responses across 525 operations, and most of them carry only a description string
  with no response schema. The status/description pairs below are what the contract
  actually declares.
envelopes:
- name: portal-error
  source: docs
  content_type: application/json
  shape:
    errorCode: integer — mirrors the HTTP status
    displayError: string — short human-readable reason shown in the Portal UI
    detailedError: string — longer detail, frequently an empty string
  example:
    errorCode: 403
    displayError: Token Expired
    detailedError: ''
- name: v1AuthErrorPostResponse
