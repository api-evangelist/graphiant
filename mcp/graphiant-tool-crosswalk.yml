gaps:
- The published bundle declares no operationId, so no stable machine identifier exists
  to bind a tool to. This crosswalk uses the openapi-generator-derived SDK method name,
  which is stable only as long as the path and method are stable — a path rename
  silently renames the identifier.
- The bundle declares no tags, so operations cannot be grouped by the contract itself;
  the categories above are derived from path prefixes.
- 96.4% of the REST surface has no candidate tool. That is a deliberate read-first,
  safety-first choice given the absence of an idempotency contract, not a coverage
  failure to be closed mechanically.
