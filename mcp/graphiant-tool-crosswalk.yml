mcp_only_note: >-
  Empty by construction — Graphiant publishes no MCP tool surface, so nothing can
  diverge from REST. Gina AI is the one capability with no REST-tool equivalent in this
  crosswalk, but it is reached through ordinary /v2/assistant/* operations rather than
  through a distinct protocol, so it is a rest_only capability rather than an mcp_only one.
rest_only:
- capability: device configuration writes
  operations: 45
  paths: [/v1/devices, '/v1/devices/{deviceId}/config', '/v1/devices/{deviceId}/draft']
  reason: >-
    deliberately excluded from the candidate tool set — PUT /v1/devices/{deviceId}/config
    mutates production network state, is asynchronous, carries no idempotency key, and
    treats a null value as a delete instruction
- capability: global policy and service objects
  operations: 56
  paths: [/v1/global]
  reason: 43 distinct paths covering prefix/site/port lists, BGP and Graphiant filters,
    VPN profiles, content filters, SNMP, syslog, IPFIX, NTP and security/traffic/NAT
    policy — a large, mostly write-shaped surface with no read-only summary
- capability: B2B extranet and Data Exchange
  operations: 76
  paths: [/v1/extranet, /v1/extranets, /v1/extranets-b2b, /v1/extranets-b2b-peering,
    /v1/extranet-public-vif, /v2/extranet, /v1/pvif]
  reason: multi-party workflow (producer publishes, customer subscribes, match is
    reviewed and accepted) whose steps commit partner-visible state
- capability: diagnostics and remediation
  operations: 21
  paths: [/v1/diagnostic, /v1/troubleshooting]
  reason: 'includes disruptive PUT actions such as /v1/diagnostic/bgp-reset/{deviceId}
