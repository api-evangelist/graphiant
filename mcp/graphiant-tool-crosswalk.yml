source: mcp/graphiant-mcp.yml + openapi/graphiant-portal-openapi-original.json
notes: >-
  Graphiant ships no MCP server and no GraphQL endpoint, so this crosswalk binds the
  CANDIDATE tool set in mcp/graphiant-mcp.yml to the REST operations that back it, and
  records how much of the 525-operation surface an agent-facing tool layer would leave
  unreached. Confidence is high throughout because every tool was derived FROM an
  operation rather than reconciled against a vendor-published tool list — there is no
  independent tool surface to diverge from. When Graphiant does publish an MCP server,
  this file is the reconciliation target: re-derive it from the real tools/list and the
  mcp_only[] section will become meaningful.
