    description: List every edge device in the current enterprise with status, model, software version,
      site, region, portal sync state and tunnel-terminator count.
    sdk_method: v1_edges_summary_get
    source_operation: openapi/graphiant-portal-openapi-original.json#GET /v1/edges-summary
    read_only: true
  - name: get_device
    description: Fetch one device by id.
    sdk_method: v1_devices_device_id_get
    source_operation: openapi/graphiant-portal-openapi-original.json#GET /v1/devices/{deviceId}
    read_only: true
  - name: get_config_job
    description: Resolve the outcome of an asynchronous configuration push by its jobId — the only way
      to learn whether a config PUT actually applied.
    sdk_method: v1_devices_device_id_jobs_job_id_get
    source_operation: openapi/graphiant-portal-openapi-original.json#GET /v1/devices/{deviceId}/jobs/{jobId}
    read_only: true
