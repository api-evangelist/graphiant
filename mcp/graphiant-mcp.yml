existing_agent_surface:
  name: Gina AI
  kind: in-product assistant, not MCP
  docs: https://docs.graphiant.com/docs/introducing-gina-ai
  marketing: https://www.graphiant.com/use-cases/gina-ai
  api_paths:
  - POST /v2/assistant/add-to-conversation
  - POST /v2/assistant/get-conversations
  - POST /v2/assistant/get-conversation-details
  - POST /v2/assistant/update-conversation-name
  - DELETE /v2/assistant/delete-conversation-chat/{conversationId}
  - POST /v2/assistant/conversation-context-history/
  - POST /v2/assistant/conversation-interface-enable-disable/
  - GET /v2/assistant/conversation-interface-state/
  - GET /v2/assistant/version
authentication:
  model: opaque bearer token in the `authorization` header
  obtain: POST https://api.graphiant.com/v1/auth/login
  lifetime_minutes: 30
  refresh: GET https://api.graphiant.com/v1/auth/refresh
  detail: authentication/graphiant-authentication.yml
  warning: A 30-minute non-renewable-by-default token is a hard constraint on any long-running agent.
    A server built on this contract must refresh proactively rather than react to the 403 "Token Expired"
    envelope.
tools:
  note: Candidate read-first tool set. Every source_operation below is a real path+method in the published
    bundle. The bundle carries no operationIds, so each tool names the generated SDK method (the de-facto
    operation identifier that `graphiant invoke` accepts) alongside the raw path.
  safety: Write operations are deliberately excluded from the default set. PUT /v1/devices/{deviceId}/config
    mutates production network configuration, is asynchronous, has no idempotency key, and interprets
    a null value as a delete — it should never be an unattended agent tool.
