notes: Graphiant publishes NO hosted or remote MCP server. Searched the documentation site, the Graphiant-Inc
  GitHub organization (3 public repositories, none MCP), npm under @modelcontextprotocol and the public
  MCP registries — nothing. Graphiant does ship an agentic surface, Gina AI, but it is an in-portal assistant
  reachable only through the authenticated /v2/assistant/* REST operations; it is not an MCP server and
  exposes no tools/list endpoint. The tool set below is a CANDIDATE derived from real OpenAPI operations
  so that an agent operator can stand up their own server against the published contract. It is not a
  Graphiant product and must not be presented as one.
