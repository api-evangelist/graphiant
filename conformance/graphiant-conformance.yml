    with 460 paths, 525 operations and 1,568 component schemas'
- id: oauth2
  conforms: false
  evidence: 'the only securityScheme is jwtAuth, type apiKey in the authorization
    header; no oauth2 flows are declared and no OAuth endpoints are documented'
- id: oidc
