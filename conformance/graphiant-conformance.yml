notes: >-
  Graphiant's API conforms to OpenAPI 3.0.0 and little else in the cross-cutting
  standards space — it is a proprietary JSON-over-HTTP surface fronting a gRPC control
  plane, with a bespoke bearer token instead of OAuth 2.0/OIDC and a proprietary error
  envelope instead of RFC 9457. Its real standards story is on the network side
  (BGP, OSPF, IPsec, MACsec, IPFIX, SNMPv3, SAML 2.0, post-quantum cryptography) and
  in its published security attestations.
standards:
