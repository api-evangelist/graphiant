summary: >-
  Graphiant publishes no /.well-known/ discovery surface. No security.txt, no OIDC or
  OAuth authorization-server metadata (consistent with its bespoke bearer-token login
  at POST /v1/auth/login rather than OAuth 2.0), no api-catalog, no ai-plugin and no
  A2A agent card. The API host api.graphiant.com answers every unauthenticated request
  — including /.well-known/* — with HTTP 403 Forbidden, so nothing is discoverable
  there anonymously. Graphiant DOES publish llms.txt on both the marketing site and
  the documentation host (captured in llms/).
