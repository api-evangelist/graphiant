cross_cutting_rules:
- 'Send exactly one authorization Bearer header — duplicated auth headers are rejected
  with 400 by some upstream gateways.'
- Tokens expire after 30 minutes. Refresh proactively via GET /v1/auth/refresh rather
  than reacting to a 403.
- There is no idempotency contract. Never blind-retry an unsafe method; poll for an
  already-created job first.
- There is no pagination. List operations return the full collection.
- Several reads are POST operations (`*list`, `*summary`, `*overview`) because the filter
  travels in the body — a POST to those paths is a query, not a mutation.
- HTTP 200 on a configuration PUT means accepted, not applied. Resolve the returned
  jobId.
- In a device config document, an omitted key means "leave unchanged" and a null value
  means "delete".
- Timestamps are protobuf `{seconds, nanos}` objects in UTC, not RFC 3339 strings.
- Errors are `{errorCode, displayError, detailedError}`, not RFC 9457 problem+json.
- Identifiers are unprefixed 64-bit integers; never infer entity type from an id.
