aid: graphiant
name: Graphiant
description: Graphiant is a Network-as-a-Service (NaaS) provider that replaces fragmented SD-WAN, MPLS and cloud-networking stacks with a single
  cloud-native subscription service built on a stateless core architecture. Founded by former Viptela CTO Khalid Raza, the platform connects branches,
  data centers, public and neo-cloud environments, remote users, AI agents, applications, customers and business partners, delivering private
  connectivity, end-to-end and post-quantum encryption, data-sovereignty routing controls, Zero Trust Network Access, data loss prevention, deep
  packet inspection and real-time observability. Everything the Graphiant Portal can do is exposed through a token-authenticated REST/JSON API
  at api.graphiant.com covering device and edge configuration, sites, circuits and interfaces, LAN segments, BGP and routing policy, gateways,
  B2B extranet and Data Exchange, assurance and AI-adoption analytics, alarms, notifications and third-party integrations, users, tenants and
  MSP account switching. Graphiant publishes the OpenAPI bundle that generates its open-source Python and Go SDKs, ships a graphiant CLI, and
  maintains an Ansible collection of NaaS playbooks.
