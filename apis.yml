apis:
- aid: graphiant:graphiant-portal-api
  name: Graphiant Portal REST API
  description: 'The Graphiant Portal REST API is the machine-readable surface of the
    Graphiant NaaS platform. It exposes 525 operations across 460 paths on api.graphiant.com
    covering authentication and MSP tenant switching, enterprises and users, edges,
    devices and device configuration jobs, sites, circuits, interfaces and LAG, LAN
    segments and prefixes, BGP peering and routing filters, gateways and public VIF,
    B2B extranet and Data Exchange, assurance/AI-adoption analytics, alarms, notifications,
    allowlists and integrations, licensing and billing. Requests carry a bearer token
    obtained from POST /v1/auth/login; tokens live 30 minutes and are renewed at /v1/auth/refresh.'
  humanURL: https://docs.graphiant.com/docs/graphiant-portal-rest-api
