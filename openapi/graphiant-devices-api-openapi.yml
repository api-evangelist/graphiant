        schema:
          type: integer
          format: int64
          example: 1234567891011
      - name: jobId
        in: path
        required: true
        description: id of the job as received from the Enqueue* calls.
        schema:
          type: integer
          format: int64
          example: 1234567891011
        example: 1234
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
