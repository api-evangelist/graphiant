    v1UsersGetResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/commonUser'
      additionalProperties: false
    commonUser:
      type: object
      properties:
        email:
          type: string
          example: example string
        enterpriseId:
          type: integer
          format: int64
          example: 1234567891011
        firstName:
          type: string
          example: example string
        lastActiveAt:
          $ref: '#/components/schemas/googleProtobufTimestamp'
        lastName:
          type: string
          example: example string
        mfaFactor:
          type: string
          example: example string
        phoneNumber:
          type: string
          example: example string
        timeZone:
          type: string
          example: example string
        userId:
          type: string
          example: example string
        verified:
          type: boolean
          example: true
      additionalProperties: false
    v1UsersPasswordsExpirePostResponse:
      type: object
      properties:
        failedCount:
          type: integer
