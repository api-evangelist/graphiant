          example: 123
        failedUsers:
          type: array
          items:
            $ref: '#/components/schemas/iamFailedUser'
        successCount:
          type: integer
          format: int32
          example: 123
      additionalProperties: false
    v1UsersIdEnterprisesGetResponse:
      type: object
      properties:
        enterprises:
          type: array
          items:
            $ref: '#/components/schemas/iamEnterprise'
      additionalProperties: false
    v1UsersIdGroupsEnterprisesGetResponse:
