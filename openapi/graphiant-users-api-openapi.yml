          example: 1234567891011
        emptySitesCount:
          type: integer
          format: int64
          example: 1234567891011
        impairedSitesCount:
          type: integer
          format: int64
          example: 1234567891011
        stagingDownCount:
          type: integer
          format: int64
          example: 1234567891011
        stagingUpCount:
          type: integer
          format: int64
          example: 1234567891011
        totalCustomers:
          type: integer
          format: int64
          example: 1234567891011
        totalEdges:
          type: integer
          format: int64
          example: 1234567891011
        totalMsps:
          type: integer
          format: int64
          example: 1234567891011
        totalSites:
          type: integer
          format: int64
          example: 1234567891011
        upSitesCount:
          type: integer
          format: int64
          example: 1234567891011
      additionalProperties: false
    iamEnterprisePermissions:
      type: object
      properties:
        groupType:
          type: string
          example: ENUM_VALUE
          description: ' (required)'
        permissions:
          $ref: '#/components/schemas/commonPermissions'
      additionalProperties: false
    iamCustomer:
      type: object
      properties:
        adminEmail:
          type: string
          example: example string
        companyName:
          type: string
          example: example string
        counts:
          $ref: '#/components/schemas/iamCounts'
        description:
          type: string
          example: example string
        enterpriseId:
          type: integer
          format: int64
          example: 1234567891011
        impersonationEnabled:
          type: boolean
          example: true
        marketplaceId:
          type: string
          example: example string
      additionalProperties: false
    v1UsersPutRequest:
      type: object
      properties:
        email:
          type: string
          example: example string
          description: ' (required)'
        firstName:
          type: string
          example: example string
          description: ' (required)'
        groupId:
          type: string
          example: example string
        lastName:
          type: string
          example: example string
          description: ' (required)'
        timeZone:
          type: string
          example: example string
      additionalProperties: false
      required:
      - email
      - firstName
      - lastName
  securitySchemes:
    jwtAuth:
      type: apiKey
      in: header
      name: authorization
      description: Use `Bearer <token>`
