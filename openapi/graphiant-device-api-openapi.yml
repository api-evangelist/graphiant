      - name: address
        in: query
        description: BGP Nbr address
        required: true
        schema:
          type: string
          example: example string
        example: 10.121.12.34
      - name: deviceId
        in: query
        description: Valid configured device ID > 0
        required: true
        schema:
          type: integer
          format: int64
          example: 1234567891011
        example: 1000000
      - name: vrfName
        in: query
        description: Valid configured VRF name
        required: true
